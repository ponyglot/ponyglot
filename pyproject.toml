[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[project]
name = "ponyglot"
version = "0.1.0.dev0"
description = "Ponyglot core: one translation layer for your Django stack (API client, sync, django-parler and django-modeltranslation adapters)."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Fabian Braun", email = "hello@ponyglot.app" }]
requires-python = ">=3.10"
dependencies = ["Django>=5.2"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Localization",
]

[project.optional-dependencies]
parler = ["django-parler>=2.3"]
modeltranslation = ["django-modeltranslation>=0.18"]
gettext = ["polib>=1.2"]

[project.scripts]
ponyglot = "ponyglot.cli:main"

[project.urls]
Homepage = "https://ponyglot.app"
Documentation = "https://docs.ponyglot.app"

[dependency-groups]
dev = [
  "django-modeltranslation>=0.18",
  "django-parler>=2.3",
  "polib>=1.2",
  "pytest>=8",
  "pytest-django>=4.9",
  "ruff>=0.12",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.md"]  # README examples are written for reading, not formatted

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"src/ponyglot/migrations/**" = ["E501"]
